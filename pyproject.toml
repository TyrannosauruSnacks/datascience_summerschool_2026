[project]
name = "pydata-book"
version = "3.0.0"
description = "Code and materials for Python for Data Analysis, 3rd Edition"
requires-python = ">=3.9"
dependencies = [
    "ipython>=8.18.1",
    "jupyter-cache>=1.0.1",
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
]

[tool.uv.extra-build-dependencies]
pandas = ["pkg_resources"]  

dependencies = [
    "numpy",
    "pandas==2.0.3",
    "matplotlib",
    "lxml",
    "seaborn",
    "statsmodels",
    "scipy",
    "patsy",
    "scikit-learn",
    "beautifulsoup4",
    "jupyter",
    "ipython",
    "requests",
    "sqlalchemy",
    "pytz",
    "python-cache"
]

[tool.uv.workspace]
members = [
    "test",
]

[project.optional-dependencies]
dev = [
    "jupyter",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

